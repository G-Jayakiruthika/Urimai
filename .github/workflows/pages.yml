name: preview

# Static preview on GitHub Pages. No server runs here, so the page uses its
# built-in rules engine (the same shared/rules.js the Cloud Run server uses).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir dist
          cp -r public/. dist/
          cp shared/rules.js shared/letters.js dist/js/
          sed -i -E 's#(src|href|content)="/([a-z])#\1="./\2#g' dist/index.html
          touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
